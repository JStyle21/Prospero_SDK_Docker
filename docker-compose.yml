services:
  # PS5 SDK build service (default)
  ps5-build:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SDK_TYPE=ps5
      - PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
    volumes:
      - ${PROJECT_PATH:-.}:/project
    working_dir: /project

  # PS4 SDK build service
  ps4-build:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SDK_TYPE=ps4
      - PS4_PAYLOAD_SDK=/opt/ps4-payload-sdk
    volumes:
      - ${PROJECT_PATH:-.}:/project
    working_dir: /project

  # Interactive shell with PS5 SDK
  ps5-shell:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SDK_TYPE=ps5
      - PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
    volumes:
      - ${PROJECT_PATH:-.}:/project
    working_dir: /project
    stdin_open: true
    tty: true
    command: /bin/bash

  # Interactive shell with PS4 SDK
  ps4-shell:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SDK_TYPE=ps4
      - PS4_PAYLOAD_SDK=/opt/ps4-payload-sdk
    volumes:
      - ${PROJECT_PATH:-.}:/project
    working_dir: /project
    stdin_open: true
    tty: true
    command: /bin/bash
